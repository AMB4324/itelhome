<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>itel Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5f7fa;
            color: #1f2937;
            font-family: sans-serif;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 150px;
            text-align: center;
        }
        .top-bar {
            width: 100%;
            text-align: left;
            margin-bottom: 3px;
        }
        .settings-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            font-size: 6px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .logo-box {
            width: 100%;
            background: #ffffff;
            padding: 6px 4px;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #d1d5db;
            font-size: 0;
        }
        .brand-logo {
            display: inline-block;
            height: 20px;
            width: 55px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
        }
        .logo-itel { background-image: url('itel.png'); }
        .logo-am { background-image: url('amiosfix.png'); }
        .logo-divider {
            display: inline-block;
            width: 1px;
            height: 16px;
            background-color: #d1d5db;
            vertical-align: middle;
            margin: 0 4px;
        }
        .clock-card {
            width: 100%;
            background: #ffffff;
            padding: 4px;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #d1d5db;
        }
        #time {
            font-size: 14px;
            font-weight: bold;
            color: #111827;
        }
        #date {
            font-size: 7px;
            color: #4b5563;
            text-transform: uppercase;
            font-weight: bold;
        }
        .search-box {
            width: 100%;
            margin-bottom: 4px;
        }
        .search-pill {
            background: #ffffff;
            border: 1.5px solid #3b82f6;
            border-radius: 8px;
            padding: 3px;
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 72%;
            background: transparent;
            color: #1f2937;
            border: none;
            font-size: 8px;
            outline: none;
            padding: 2px;
            vertical-align: middle;
        }
        input::placeholder {
            color: #9ca3af;
        }
        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 7px;
            font-weight: bold;
            cursor: pointer;
            vertical-align: middle;
        }
        .grid {
            width: 100%;
            font-size: 0;
            margin-bottom: 4px;
        }
        .card {
            display: inline-block;
            width: 48%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 6px 2px;
            text-align: center;
            text-decoration: none;
            color: #374151;
            font-size: 8px;
            font-weight: bold;
            margin-bottom: 4px;
            vertical-align: top;
        }
        .card:nth-child(odd) {
            margin-right: 4%;
        }
        .card-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
            margin-right: 3px;
        }
        .footer {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
        }
        .footer-text {
            font-size: 6px;
            font-weight: bold;
            color: #6b7280;
            text-transform: uppercase;
            display: block;
        }
        .panel-card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            margin-bottom: 4px;
        }
        .panel-title {
            font-size: 8px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .phone-img {
            width: 100%;
            max-height: 75px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 3px;
            border: 1px solid #e5e7eb;
        }
        .phone-details {
            font-size: 7px;
            color: #4b5563;
            text-align: left;
            line-height: 1.2;
            background: #f9fafb;
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .phone-details b {
            color: #1f2937;
        }
        .action-btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 3px;
        }
        .auth-input {
            width: 100%;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 4px;
            font-size: 7px;
            color: #1f2937;
            margin-bottom: 4px;
            outline: none;
        }
        .auth-error {
            font-size: 6px;
            color: #ef4444;
            margin-bottom: 3px;
            display: none;
        }
        .auth-switch {
            font-size: 6px;
            color: #3b82f6;
            cursor: pointer;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- AUTH VIEW -->
        <div id="authView" style="display: none;">
            <div class="logo-box">
                <div class="brand-logo logo-itel"></div>
                <div class="logo-divider"></div>
                <div class="brand-logo logo-am"></div>
            </div>
            <div class="panel-card">
                <div class="panel-title" id="authTitle">Login</div>
                <div class="auth-error" id="authError">Invalid details</div>
                <input type="text" id="authUsername" class="auth-input" placeholder="Username">
                <input type="password" id="authPassword" class="auth-input" placeholder="Password">
                <button onclick="handleAuth()" class="action-btn" id="authSubmitBtn">Login</button>
                <span class="auth-switch" onclick="toggleAuthMode()" id="authSwitchText">Need an account? Sign up</span>
            </div>
        </div>

        <!-- HOME VIEW -->
        <div id="homeView" style="display: none;">
            <div class="top-bar">
                <button onclick="showAbout()" class="settings-btn">⚙️ Settings</button>
            </div>

            <div class="logo-box">
                <div class="brand-logo logo-itel"></div>
                <div class="logo-divider"></div>
                <div class="brand-logo logo-am"></div>
            </div>

            <div class="clock-card">
                <div id="time">Loading...</div>
                <div id="date">Loading...</div>
            </div>

            <form class="search-box" action="https://www.google.com/search" method="GET">
                <input type="hidden" name="client" value="ms-opera-mini">
                <input type="hidden" name="gws_rd" value="ssl">
                <div class="search-pill">
                    <input type="text" name="q" id="searchInput" placeholder="Search Google..." autocomplete="off">
                    <button type="submit" class="search-btn">Go</button>
                </div>
            </form>

            <div class="grid">
                <a href="https://www.google.com" class="card"><span>Google</span></a>
                <a href="https://en.m.wikipedia.org" class="card"><span>Wikipedia</span></a>
                <a href="https://github.com" class="card"><span>GitHub</span></a>
                <a href="https://lite.cnn.com" class="card"><span>Lite News</span></a>
            </div>

            <div class="footer">
                <span class="footer-text">AM iOS Fix</span>
            </div>
        </div>

        <!-- ABOUT PHONE VIEW -->
        <div id="aboutView" style="display: none;">
            <div class="logo-box">
                <div class="brand-logo logo-itel"></div>
                <div class="logo-divider"></div>
                <div class="brand-logo logo-am"></div>
            </div>

            <div class="panel-card">
                <div class="panel-title">About Phone</div>
                <img src="IMG_0009.png" class="phone-img" alt="itel Phone" onerror="this.style.display='none';">
                <div class="phone-details">
                    <b>Model:</b> itel Feature Phone<br>
                    <b>User:</b> <span id="loggedUserDisplay"></span><br>
                    <b>System:</b> AM iOS Fix Portal<br>
                    <b>Status:</b> Fully Optimized
                </div>
                <button onclick="showHome()" class="action-btn">Back</button>
                <button onclick="logout()" class="action-btn" style="background: #ef4444;">Logout</button>
            </div>
        </div>

    </div>

    <script>
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            var minutesFormatted = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('time').textContent = hours + ':' + minutesFormatted + ' ' + ampm;

            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('date').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
        }
        updateClock();
        setInterval(updateClock, 1000);

        let isSignupMode = false;

        function checkAuth() {
            try {
                const currentUser = localStorage.getItem('itel_current_user');
                if (currentUser) {
                    document.getElementById('loggedUserDisplay').textContent = currentUser;
                    document.getElementById('authView').style.display = 'none';
                    document.getElementById('homeView').style.display = 'block';
                    document.getElementById('aboutView').style.display = 'none';
                } else {
                    document.getElementById('authView').style.display = 'block';
                    document.getElementById('homeView').style.display = 'none';
                    document.getElementById('aboutView').style.display = 'none';
                }
            } catch (e) {
                // Fallback if localStorage is restricted
                document.getElementById('authView').style.display = 'none';
                document.getElementById('homeView').style.display = 'block';
            }
        }

        function toggleAuthMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('authTitle').textContent = isSignupMode ? 'Sign Up' : 'Login';
            document.getElementById('authSubmitBtn').textContent = isSignupMode ? 'Create Account' : 'Login';
            document.getElementById('authSwitchText').textContent = isSignupMode ? 'Already have an account? Login' : 'Need an account? Sign up';
            document.getElementById('authError').style.display = 'none';
        }

        function handleAuth() {
            const user = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            const errorEl = document.getElementById('authError');

            if (!user || !pass) {
                errorEl.textContent = 'Please fill all fields';
                errorEl.style.display = 'block';
                return;
            }

            try {
                let users = JSON.parse(localStorage.getItem('itel_users') || '{}');

                if (isSignupMode) {
                    if (users[user]) {
                        errorEl.textContent = 'Username already exists';
                        errorEl.style.display = 'block';
                        return;
                    }
                    users[user] = pass;
                    localStorage.setItem('itel_users', JSON.stringify(users));
                    localStorage.setItem('itel_current_user', user);
                    checkAuth();
                } else {
                    if (users[user] && users[user] === pass) {
                        localStorage.setItem('itel_current_user', user);
                        checkAuth();
                    } else {
                        errorEl.textContent = 'Invalid username or password';
                        errorEl.style.display = 'block';
                    }
                }
            } catch (e) {
                errorEl.textContent = 'Storage error';
                errorEl.style.display = 'block';
            }
        }

        function logout() {
            try {
                localStorage.removeItem('itel_current_user');
            } catch (e) {}
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
            checkAuth();
        }

        function showAbout() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('aboutView').style.display = 'block';
        }

        function showHome() {
            document.getElementById('aboutView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
        }

        checkAuth();
    </script>
</body>
</html>
