<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>itel Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 224px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        /* Dual Brand Top Logo Card */
        .logo-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .logo-box img {
            height: 20px;
            max-width: 80px;
            width: auto;
            object-fit: contain;
            display: block;
        }
        .logo-divider {
            width: 1px;
            height: 18px;
            background-color: #d1d5db;
            flex-shrink: 0;
        }
        /* Modern Clock & Date Card */
        .clock-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        #time {
            font-size: 19px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
        }
        #date {
            font-size: 8.5px;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 1px;
            font-weight: 600;
        }
        /* Sleek Modern Pill-Style Search Bar */
        .search-box {
            width: 100%;
        }
        .search-pill {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #3b82f6;
            border-radius: 20px;
            padding: 2px 4px 2px 8px;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.12);
            transition: all 0.2s ease;
        }
        .search-pill:focus-within {
            border-color: #2563eb;
            box-shadow: 0 3px 12px rgba(59, 130, 246, 0.25);
        }
        select {
            background: transparent;
            border: none;
            color: #2563eb;
            font-size: 8.5px;
            font-weight: 800;
            outline: none;
            cursor: pointer;
            padding-right: 4px;
            border-right: 1px solid #e5e7eb;
            margin-right: 4px;
        }
        input[type="text"] {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #1f2937;
            border: none;
            font-size: 9.5px;
            outline: none;
            padding: 4px;
            font-weight: 500;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 8.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
            transition: background 0.1s;
        }
        .search-btn:active {
            background: #1d4ed8;
        }
        /* Modern 2x2 Grid Menu Cards */
        .grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            text-decoration: none;
            color: #374151;
            font-size: 9.5px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: transform 0.1s ease, background 0.1s ease;
        }
        .card:active {
            transform: scale(0.96);
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }
        .card img {
            width: 18px;
            height: 18px;
            max-width: 18px;
            max-height: 18px;
            object-fit: contain;
            display: block;
        }
        /* Modern Footer */
        .footer {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-top: 2px;
        }
        .footer-logos {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .footer-logos img {
            height: 14px;
            max-width: 60px;
            width: auto;
            object-fit: contain;
            display: block;
        }
        .footer-divider {
            width: 1px;
            height: 12px;
            background-color: #d1d5db;
            flex-shrink: 0;
        }
        .footer-text {
            font-size: 7.5px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dual Brand Logo Card (Itel | AM iOS Fix) -->
        <div class="logo-box">
            <img src="itel.png" alt="itel">
            <div class="logo-divider"></div>
            <img src="amiosfix.png" alt="AM iOS Fix">
        </div>

        <!-- Clock & Date Card -->
        <div class="clock-card">
            <div id="time">10:09 AM</div>
            <div id="date">Tue, Nov 28</div>
        </div>

        <!-- Modern Pill-Style Search Bar -->
        <form class="search-box" id="searchForm" onsubmit="handleSearch(event)">
            <div class="search-pill">
                <select id="engineSelect">
                    <option value="https://www.google.com/search?q=">Google</option>
                    <option value="https://duckduckgo.com/?q=">Duck</option>
                    <option value="https://en.wikipedia.org/wiki/Special:Search?search=">Wiki</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search web..." required autocomplete="off">
                <button type="submit" class="search-btn">🔍</button>
            </div>
        </form>

        <!-- 2x2 Grid Menu -->
        <div class="grid">
            <a href="https://www.google.com" class="card">
                <img src="google.png" alt="Google">
                <span>Google</span>
            </a>
            <a href="https://en.m.wikipedia.org" class="card">
                <img src="wikipedia.png" alt="Wikipedia">
                <span>Wikipedia</span>
            </a>
            <a href="https://github.com" class="card">
                <img src="github.png" alt="GitHub">
                <span>GitHub</span>
            </a>
            <a href="https://lite.cnn.com" class="card">
                <img src="news.png" alt="News">
                <span>Lite News</span>
            </a>
        </div>

        <!-- Footer with Both Logos & Attribution -->
        <div class="footer">
            <div class="footer-logos">
                <img src="itel.png" alt="itel">
                <div class="footer-divider"></div>
                <img src="amiosfix.png" alt="AM iOS Fix">
            </div>
            <span class="footer-text">Powered by the AM iOS Fix</span>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            document.getElementById('time').textContent = `${hours}:${minutes} ${ampm}`;

            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function handleSearch(event) {
            event.preventDefault();
            const engine = document.getElementById('engineSelect').value;
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = engine + encodeURIComponent(query);
            }
        }
    </script>
</body>
</html>
