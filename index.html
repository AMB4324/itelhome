<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>itel Home</title>
    <link rel="icon" type="image/png" href="itel.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        /* Locked Proportional Brand Box */
        .logo-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 5px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .brand-logo {
            height: 16px;
            width: 65px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .logo-itel {
            background-image: url('itel.png');
        }
        .logo-am {
            background-image: url('amiosfix.png');
        }
        .logo-divider {
            width: 1px;
            height: 14px;
            background-color: #d1d5db;
        }
        /* Modern Clock & Date Card */
        .clock-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 5px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        #time {
            font-size: 17px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
        }
        #date {
            font-size: 8px;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 1px;
            font-weight: 600;
        }
        /* Sleek Modern Pill-Style Search Bar */
        .search-box {
            width: 100%;
        }
        .search-pill {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1.5px solid #3b82f6;
            border-radius: 18px;
            padding: 2px 4px 2px 7px;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.12);
        }
        select {
            background: transparent;
            border: none;
            color: #2563eb;
            font-size: 8px;
            font-weight: 800;
            outline: none;
            cursor: pointer;
            padding-right: 3px;
            border-right: 1px solid #e5e7eb;
            margin-right: 3px;
        }
        input[type="text"] {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #1f2937;
            border: none;
            font-size: 9px;
            outline: none;
            padding: 3px;
            font-weight: 500;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        /* Modern 2x2 Grid Menu Cards */
        .grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 7px 4px;
            text-align: center;
            text-decoration: none;
            color: #374151;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }
        .card:active {
            transform: scale(0.96);
            background: #eff6ff;
            color: #2563eb;
        }
        .card-icon {
            width: 16px;
            height: 16px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* Modern Footer */
        .footer {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .footer-logos {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-logo-item {
            height: 14px;
            width: 50px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .footer-divider {
            width: 1px;
            height: 12px;
            background-color: #d1d5db;
        }
        .footer-text {
            font-size: 7px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dual Brand Logo Card -->
        <div class="logo-box">
            <div class="brand-logo logo-itel"></div>
            <div class="logo-divider"></div>
            <div class="brand-logo logo-am"></div>
        </div>

        <!-- Clock & Date Card -->
        <div class="clock-card">
            <div id="time">Loading...</div>
            <div id="date">Loading...</div>
        </div>

        <!-- Native Google Search Form -->
        <form class="search-box" action="https://www.google.com/search" method="GET">
            <div class="search-pill">
                <select id="engineSelect" disabled style="opacity: 0.8;">
                    <option value="google">Google</option>
                </select>
                <input type="text" name="q" id="searchInput" placeholder="Search Google..." autocomplete="off">
                <button type="submit" class="search-btn">🔍</button>
            </div>
        </form>

        <!-- 2x2 Grid Menu -->
        <div class="grid">
            <a href="https://www.google.com" class="card">
                <div class="card-icon" style="background-image: url('google.png');"></div>
                <span>Google</span>
            </a>
            <a href="https://en.m.wikipedia.org" class="card">
                <div class="card-icon" style="background-image: url('wikipedia.png');"></div>
                <span>Wikipedia</span>
            </a>
            <a href="https://github.com" class="card">
                <div class="card-icon" style="background-image: url('github.png');"></div>
                <span>GitHub</span>
            </a>
            <a href="https://lite.cnn.com" class="card">
                <div class="card-icon" style="background-image: url('news.png');"></div>
                <span>Lite News</span>
            </a>
        </div>

        <!-- Footer with Both Logos & Attribution -->
        <div class="footer">
            <div class="footer-logos">
                <div class="footer-logo-item logo-itel"></div>
                <div class="footer-divider"></div>
                <div class="footer-logo-item logo-am"></div>
            </div>
            <span class="footer-text">Powered by the AM iOS Fix</span>
        </div>
    </div>

    <script>
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            var minutesFormatted = minutes < 10 ? '0' + minutes : minutes;
            
            var timeString = hours + ':' + minutesFormatted + ' ' + ampm;
            document.getElementById('time').textContent = timeString;

            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            var dayName = days[now.getDay()];
            var monthName = months[now.getMonth()];
            var dateNum = now.getDate();
            
            var dateString = dayName + ', ' + monthName + ' ' + dateNum;
            document.getElementById('date').textContent = dateString;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
