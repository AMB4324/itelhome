<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>itel Home</title>
    <link rel="icon" type="image/png" href="itel.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f5f7fa;
            color: #1f2937;
            font-family: sans-serif;
            padding: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 140px;
            text-align: center;
        }
        /* Dual Brand Logo Card */
        .logo-box {
            width: 100%;
            background: #ffffff;
            padding: 3px;
            border-radius: 4px;
            margin-bottom: 3px;
            border: 1px solid #d1d5db;
        }
        .brand-logo {
            display: inline-block;
            height: 12px;
            width: 45px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
        }
        .logo-itel { background-image: url('itel.png'); }
        .logo-am { background-image: url('amiosfix.png'); }
        .logo-divider {
            display: inline-block;
            width: 1px;
            height: 10px;
            background-color: #d1d5db;
            vertical-align: middle;
            margin: 0 4px;
        }
        /* Modern Clock & Date Card */
        .clock-card {
            width: 100%;
            background: #ffffff;
            padding: 3px;
            border-radius: 4px;
            margin-bottom: 3px;
            border: 1px solid #d1d5db;
        }
        #time {
            font-size: 13px;
            font-weight: bold;
            color: #111827;
        }
        #date {
            font-size: 6px;
            color: #4b5563;
            text-transform: uppercase;
            font-weight: bold;
        }
        /* Search Bar */
        .search-box {
            width: 100%;
            margin-bottom: 3px;
        }
        .search-pill {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #3b82f6;
            border-radius: 10px;
            padding: 2px 4px;
        }
        select {
            background: transparent;
            border: none;
            color: #2563eb;
            font-size: 6px;
            font-weight: bold;
            outline: none;
        }
        input[type="text"] {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #1f2937;
            border: none;
            font-size: 7px;
            outline: none;
            padding: 2px;
        }
        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            font-size: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        /* Side-by-Side Bookmarks using table-cell / inline-block layout for old browsers */
        .grid {
            width: 100%;
            font-size: 0; /* fixes inline-block spacing */
            margin-bottom: 3px;
        }
        .card {
            display: inline-block;
            width: 48%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 4px 2px;
            text-align: center;
            text-decoration: none;
            color: #374151;
            font-size: 7px;
            font-weight: bold;
            margin-bottom: 3px;
            vertical-align: top;
        }
        .card:nth-child(odd) {
            margin-right: 4%; /* creates gap between the two columns */
        }
        .card-icon {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
            margin-right: 2px;
        }
        /* Modern Footer */
        .footer {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 3px;
            text-align: center;
        }
        .footer-logo-item {
            display: inline-block;
            height: 10px;
            width: 35px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
        }
        .footer-divider {
            display: inline-block;
            width: 1px;
            height: 8px;
            background-color: #d1d5db;
            vertical-align: middle;
            margin: 0 4px;
        }
        .footer-text {
            font-size: 5px;
            font-weight: bold;
            color: #6b7280;
            text-transform: uppercase;
            display: block;
            margin-top: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dual Brand Logo Card -->
        <div class="logo-box">
            <div class="brand-logo logo-itel"></div>
            <div class="logo-divider"></div>
            <div class="brand-logo logo-am"></div>
        </div>

        <!-- Clock & Date Card -->
        <div class="clock-card">
            <div id="time">Loading...</div>
            <div id="date">Loading...</div>
        </div>

        <!-- Google Search Form -->
        <form class="search-box" action="https://www.google.com/search" method="GET">
            <input type="hidden" name="client" value="ms-opera-mini">
            <input type="hidden" name="gws_rd" value="ssl">
            <div class="search-pill">
                <input type="text" name="q" id="searchInput" placeholder="Search Google..." autocomplete="off">
                <button type="submit" class="search-btn">🔍</button>
            </div>
        </form>

        <!-- 2 Bookmarks Per Row Layout -->
        <div class="grid">
            <a href="https://www.google.com" class="card">
                <div class="card-icon" style="background-image: url('google.png');"></div>
                <span>Google</span>
            </a>
            <a href="https://en.m.wikipedia.org" class="card">
                <div class="card-icon" style="background-image: url('wikipedia.png');"></div>
                <span>Wikipedia</span>
            </a>
            <a href="https://github.com" class="card">
                <div class="card-icon" style="background-image: url('github.png');"></div>
                <span>GitHub</span>
            </a>
            <a href="https://lite.cnn.com" class="card">
                <div class="card-icon" style="background-image: url('news.png');"></div>
                <span>Lite News</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-logo-item logo-itel"></div>
            <div class="footer-divider"></div>
            <div class="footer-logo-item logo-am"></div>
            <span class="footer-text">AM iOS Fix</span>
        </div>
    </div>

    <script>
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            var minutesFormatted = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('time').textContent = hours + ':' + minutesFormatted + ' ' + ampm;

            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('date').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
