<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itel Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            color: #1f2937;
            font-family: sans-serif;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 150px;
            text-align: center;
        }
        .top-bar {
            width: 100%;
            text-align: left;
            margin-bottom: 3px;
        }
        .settings-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #374151;
            font-size: 6px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .logo-box {
            width: 100%;
            background: #ffffff;
            padding: 6px 4px;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #d1d5db;
        }
        .brand-text {
            font-size: 9px;
            font-weight: bold;
            color: #2563eb;
            text-transform: uppercase;
        }
        .clock-card {
            width: 100%;
            background: #ffffff;
            padding: 4px;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #d1d5db;
        }
        #time {
            font-size: 13px;
            font-weight: bold;
            color: #111827;
        }
        #date {
            font-size: 6px;
            color: #4b5563;
            text-transform: uppercase;
            font-weight: bold;
        }
        .search-box {
            width: 100%;
            margin-bottom: 4px;
        }
        .search-pill {
            background: #ffffff;
            border: 1.5px solid #3b82f6;
            border-radius: 8px;
            padding: 3px;
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 70%;
            background: transparent;
            color: #1f2937;
            border: none;
            font-size: 8px;
            outline: none;
            padding: 2px;
        }
        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        .grid {
            width: 100%;
            margin-bottom: 4px;
        }
        .card {
            display: block;
            width: 100%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 5px;
            text-align: center;
            text-decoration: none;
            color: #374151;
            font-size: 8px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .footer {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            font-size: 6px;
            font-weight: bold;
            color: #6b7280;
            text-transform: uppercase;
        }
        .panel-card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            margin-bottom: 4px;
        }
        .panel-title {
            font-size: 8px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .phone-details {
            font-size: 7px;
            color: #4b5563;
            text-align: left;
            line-height: 1.2;
            background: #f9fafb;
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .action-btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 3px;
        }
        .auth-input {
            width: 100%;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 4px;
            font-size: 7px;
            color: #1f2937;
            margin-bottom: 4px;
        }
        .auth-error {
            font-size: 6px;
            color: #ef4444;
            margin-bottom: 3px;
            display: none;
        }
        .auth-switch {
            font-size: 6px;
            color: #3b82f6;
            cursor: pointer;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- AUTH VIEW -->
        <div id="authView">
            <div class="logo-box">
                <div class="brand-text">itel &bull; AM iOS Fix</div>
            </div>
            <div class="panel-card">
                <div class="panel-title" id="authTitle">Login</div>
                <div class="auth-error" id="authError">Fill all fields</div>
                <input type="text" id="authUsername" class="auth-input" placeholder="Username">
                <input type="password" id="authPassword" class="auth-input" placeholder="Password">
                <button onclick="handleAuth()" class="action-btn" id="authSubmitBtn">Login</button>
                <span class="auth-switch" onclick="toggleAuthMode()" id="authSwitchText">Create Account</span>
            </div>
        </div>

        <!-- HOME VIEW -->
        <div id="homeView" style="display:none;">
            <div class="top-bar">
                <button onclick="showAbout()" class="settings-btn">⚙️ Settings</button>
            </div>

            <div class="logo-box">
                <div class="brand-text">itel &bull; AM iOS Fix</div>
            </div>

            <div class="clock-card">
                <div id="time">00:00 AM</div>
                <div id="date">Loading...</div>
            </div>

            <form class="search-box" action="https://www.google.com/search" method="GET">
                <div class="search-pill">
                    <input type="text" name="q" placeholder="Search Google...">
                    <button type="submit" class="search-btn">Go</button>
                </div>
            </form>

            <div class="grid">
                <a href="https://www.google.com" class="card">Google</a>
                <a href="https://en.m.wikipedia.org" class="card">Wikipedia</a>
                <a href="https://github.com" class="card">GitHub</a>
            </div>

            <div class="footer">AM iOS Fix</div>
        </div>

        <!-- ABOUT VIEW -->
        <div id="aboutView" style="display:none;">
            <div class="logo-box">
                <div class="brand-text">itel &bull; AM iOS Fix</div>
            </div>
            <div class="panel-card">
                <div class="panel-title">Settings</div>
                <div class="phone-details">
                    <b>User:</b> <span id="loggedUserDisplay">Guest</span><br>
                    <b>Portal:</b> Active
                </div>
                <button onclick="showHome()" class="action-btn">Back</button>
                <button onclick="logout()" class="action-btn" style="background: #ef4444;">Logout</button>
            </div>
        </div>

    </div>

    <script>
        // Simple clock
        function updateClock() {
            var d = new Date();
            var h = d.getHours();
            var m = d.getMinutes();
            var ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12;
            m = m < 10 ? '0' + m : m;
            document.getElementById('time').textContent = h + ':' + m + ' ' + ampm;
            
            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            document.getElementById('date').textContent = days[d.getDay()] + ' ' + d.getDate();
        }
        updateClock();
        setInterval(updateClock, 1000);

        var isSignup = false;

        function checkAuth() {
            try {
                var user = localStorage.getItem('itel_user');
                if (user) {
                    document.getElementById('loggedUserDisplay').textContent = user;
                    document.getElementById('authView').style.display = 'none';
                    document.getElementById('homeView').style.display = 'block';
                    document.getElementById('aboutView').style.display = 'none';
                } else {
                    document.getElementById('authView').style.display = 'block';
                    document.getElementById('homeView').style.display = 'none';
                    document.getElementById('aboutView').style.display = 'none';
                }
            } catch(e) {
                // Failsafe if local storage throws security blocks on the device browser
                document.getElementById('authView').style.display = 'none';
                document.getElementById('homeView').style.display = 'block';
            }
        }

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('authTitle').textContent = isSignup ? 'Sign Up' : 'Login';
            document.getElementById('authSubmitBtn').textContent = isSignup ? 'Register' : 'Login';
            document.getElementById('authSwitchText').textContent = isSignup ? 'Switch to Login' : 'Create Account';
        }

        function handleAuth() {
            var u = document.getElementById('authUsername').value;
            var p = document.getElementById('authPassword').value;
            var err = document.getElementById('authError');

            if (!u || !p) {
                err.style.display = 'block';
                return;
            }

            try {
                localStorage.setItem('itel_user', u);
                checkAuth();
            } catch(e) {
                err.textContent = 'Storage blocked';
                err.style.display = 'block';
            }
        }

        function logout() {
            try {
                localStorage.removeItem('itel_user');
            } catch(e) {}
            checkAuth();
        }

        function showAbout() {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('aboutView').style.display = 'block';
        }

        function showHome() {
            document.getElementById('aboutView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
        }

        // Run immediately
        checkAuth();
    </script>
</body>
</html>
